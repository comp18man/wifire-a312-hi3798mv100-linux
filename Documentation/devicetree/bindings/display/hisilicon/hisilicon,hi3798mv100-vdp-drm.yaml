%YAML 1.2
---
$id: http://devicetree.org/schemas/display/hisilicon/hisilicon,hi3798mv100-vdp-drm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 DRM/KMS output

maintainers:
  - linux-arm-kernel@lists.infradead.org

description: >
  Virtual node tying the Hi3798MV100 display pipeline together. It owns no
  registers of its own - it names the blocks that make up the pipeline and
  registers the resulting DRM device.

properties:
  compatible:
    const: hisilicon,hi3798mv100-vdp-drm

  ports:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    minItems: 2
    maxItems: 2
    description: |
      Graph endpoints of the blocks forming the display pipeline, in order:
      the VDP display controller output that drives the CRTC, and the HDMI
      transmitter output.

required:
  - compatible
  - ports

additionalProperties: false

examples:
  - |
    drm {
        compatible = "hisilicon,hi3798mv100-vdp-drm";
        ports = <&vdp_out>, <&hdmi_out>;
    };
