%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/hisilicon,hi3798mv100-volt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 PWM Voltage Regulator

maintainers:
  - linux-arm-kernel@lists.infradead.org

allOf:
  - $ref: regulator.yaml#

properties:
  compatible:
    const: hisilicon,hi3798mv100-volt

  reg:
    maxItems: 1

  reg-names:
    items:
      - const: base-address

required:
  - compatible
  - reg
  - regulator-name
  - regulator-min-microvolt
  - regulator-max-microvolt

unevaluatedProperties: false

examples:
  - |
    vdd_cpu: regulator@8a2301c {
      compatible = "hisilicon,hi3798mv100-volt";
      reg = <0x8a2301c 0x4>;
      reg-names = "base-address";
      regulator-name = "vdd-cpu";
      regulator-min-microvolt = <920000>;
      regulator-max-microvolt = <1495000>;
      regulator-boot-on;
      regulator-always-on;
    };
...
