# SPDX-License-Identifier: GPL-2.0
%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/hisilicon,hi3798mv100-aiao.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HiSilicon Hi3798MV100 Audio Input/Output Controller (AIAO)

maintainers:
  - Hisilicon STB Platform <linux-arm-kernel@lists.infradead.org>

description: |
  Hi3798MV100 Audio Input/Output controller block used as a parent bus for
  I2S transmit interfaces.

properties:
  compatible:
    items:
      - const: hisilicon,hi3798mv100-aiao
      - const: simple-bus

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: aiao

  resets:
    maxItems: 1

  reset-names:
    items:
      - const: core

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - "#address-cells"
  - "#size-cells"
  - ranges

patternProperties:
  "^i2s@[0-9a-f]+$":
    type: object
    properties:
      compatible:
        const: hisilicon,hi3798mv100-i2s

      reg:
        maxItems: 1

      interrupts:
        maxItems: 1

      clocks:
        maxItems: 1

      clock-names:
        items:
          - const: mclk

      resets:
        maxItems: 1

      reset-names:
        items:
          - const: core

      "#sound-dai-cells":
        const: 0

    required:
      - compatible
      - reg
      - "#sound-dai-cells"

    additionalProperties: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/histb-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <1>;
        #size-cells = <1>;

        aiao: aiao@8cd0000 {
            compatible = "hisilicon,hi3798mv100-aiao", "simple-bus";
            reg = <0x8cd0000 0x10000>;
            interrupts = <GIC_SPI 84 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&crg HISTB_AIAO_CLK>;
            clock-names = "aiao";
            resets = <&crg 0x118 4>;
            reset-names = "core";
            #address-cells = <1>;
            #size-cells = <1>;
            ranges = <0x0 0x8cd0000 0x10000>;

            i2s@2000 {
                compatible = "hisilicon,hi3798mv100-i2s";
                reg = <0x2000 0x100>;
                interrupts = <GIC_SPI 84 IRQ_TYPE_LEVEL_HIGH>;
                clocks = <&crg HISTB_AIAO_CLK>;
                clock-names = "mclk";
                resets = <&crg 0x118 4>;
                reset-names = "core";
                #sound-dai-cells = <0>;
            };
        };
    };
